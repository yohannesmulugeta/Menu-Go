<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="description" content="ADMAKI Menu — a mobile-first digital guest experience for restaurants." />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ADMAKI Menu" />
    <meta property="og:description" content="A mobile-first digital guest experience for restaurants." />
    <meta property="og:url" content="https://yohannesmulugeta.github.io/Menu-Go/" />
    <link rel="canonical" href="https://yohannesmulugeta.github.io/Menu-Go/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:image" content="https://app.admakidigital.com/brand/social-preview.png" />
    <title>ADMAKI Menu</title>
    <script>
      // GitHub Pages has no rewrite rules. Restore the route saved by public/404.html
      // before React Router starts so direct menu, manager, and platform links work.
      try {
        const menuGoRedirect = sessionStorage.getItem("menu-go-redirect");
        if (menuGoRedirect?.startsWith("/Menu-Go/")) {
          sessionStorage.removeItem("menu-go-redirect");
          history.replaceState(null, "", menuGoRedirect);
        }
      } catch {
        // Storage may be unavailable in strict privacy modes; the home page still works.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
