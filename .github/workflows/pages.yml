name: Verify Cloudflare menu and update legacy QR redirects

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_PUBLIC_SITE_URL: https://menu.admakidigital.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare legacy QR redirects
        run: |
          mkdir -p legacy-dist
          cp cloudflare/legacy-redirect.html legacy-dist/index.html
          cp cloudflare/legacy-redirect.html legacy-dist/404.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: legacy-dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'pull_request'
