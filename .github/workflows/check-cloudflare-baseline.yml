name: Check recovered Cloudflare baseline
on:
  pull_request:
  push:
    branches: [feature/menu-platform-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-cloudflare-baseline.mjs --test
      - run: node scripts/build-cloudflare-baseline.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build:cloudflare-frontend
      - run: npm run check:frontend-recovery
      - run: npm run check:menu-platform
      - run: npm run check:menu-onboarding
      - run: npm run check:menu-auth
      - run: npm run check:menu-features
      - run: npm run check
